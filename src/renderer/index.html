<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.discordapp.com; style-src 'self'; script-src 'self'">
<title>Packhearth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <h1>Packhearth</h1>
  <section>
    <h2>1. Discord</h2>
    <div id="dc" class="muted">未ログイン</div>
    <button id="dcin">Discordでログイン</button>
    <button id="dcout" class="ghost" hidden>ログアウト</button>
  </section>
  <section>
    <h2>2. Minecraft</h2>
    <div id="acct" class="muted">未ログイン</div>
    <button id="ms">Microsoftでログイン</button>
    <details><summary>オフラインモード</summary>
      <input id="offname" placeholder="ユーザー名"><button id="off" class="ghost">使用</button>
    </details>
  </section>
  <details class="adv">
    <summary>詳細設定</summary>
    <label>Javaパス(空=自動)<input id="java"></label>
    <label>最大メモリ<input id="max"></label>
    <label class="check"><input type="checkbox" id="notify"> バージョンアップを通知バーに表示する</label>
    <button id="save" class="ghost">保存</button>
    <button id="folder" class="ghost">フォルダを開く</button>
    <button id="admin" class="ghost">管理者の方はこちら</button>
    <p class="muted ver">バージョン <span id="ver">-</span></p>
  </details>
</aside>

<main>
  <div id="update" class="update" hidden>
    <span id="updateText"></span>
    <button id="updateBtn" class="sm" hidden>ダウンロードページを開く</button>
  </div>
  <nav class="guildbar" aria-label="Discordサーバー">
    <button id="home" class="chip on" title="追加したサーバーの一覧">★ マイリスト</button>
    <span id="guilds"></span>
    <button id="reload" class="chip" title="一覧を更新">⟳ 更新</button>
  </nav>
  <div class="head"><h2 id="title">マイリスト</h2></div>
  <div id="view" class="view"></div>
  <pre id="log"></pre>
  <div id="progressText" class="progress-text"></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="foot"><span id="sel" class="muted">サーバーを選んでください</span><button id="play" disabled>プレイ</button></div>
</main>
<script src="renderer.js"></script>
</body>
</html>
